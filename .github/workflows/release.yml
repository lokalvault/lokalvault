name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.binary }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            binary: lokalvault-macos-arm64

          - os: macos-13
            target: x86_64-apple-darwin
            binary: lokalvault-macos-x86_64

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: lokalvault-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lokalvault-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/lokalvault ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}
          tar -czf ${{ matrix.binary }}.tar.gz ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/lokalvault.exe ${{ matrix.binary }}
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath "${{ matrix.binary }}.zip"

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}.tar.gz
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}.zip
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine prerelease
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *"alpha"* ]] || \
             [[ "${{ github.ref_name }}" == *"beta"* ]] || \
             [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
          body: |
            ## Install

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lokalvault-macos-arm64.tar.gz | tar -xz
            chmod +x lokalvault-macos-arm64
            sudo mv lokalvault-macos-arm64 /usr/local/bin/lokalvault
            xattr -dr com.apple.quarantine /usr/local/bin/lokalvault
            ```

            **macOS (Intel)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lokalvault-macos-x86_64.tar.gz | tar -xz
            chmod +x lokalvault-macos-x86_64
            sudo mv lokalvault-macos-x86_64 /usr/local/bin/lokalvault
            xattr -dr com.apple.quarantine /usr/local/bin/lokalvault
            ```

            **Linux (x86_64)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lokalvault-linux-x86_64.tar.gz | tar -xz
            chmod +x lokalvault-linux-x86_64
            sudo mv lokalvault-linux-x86_64 /usr/local/bin/lokalvault
            ```

            **Windows**
            Download `lokalvault-windows-x86_64.exe.zip`, extract it, rename the binary to
            `lokalvault.exe`, and move it to a folder in your PATH.

            ## Verify checksum
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ## Known issues in alpha
            - `lokalvault shell` still exits immediately on macOS in some environments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
