[package]
name = "lokalvault-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lokalvault_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lokalvault = { path = ".." }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
